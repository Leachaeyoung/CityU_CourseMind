[project]
name = "coursemind-backend"
version = "0.1.0"
description = "Course planning and course community backend for CityU undergraduate Data Science students."
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
