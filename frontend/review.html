<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>发布评价 · CourseMind</title><link rel="stylesheet" href="styles.css?v=2"></head><body><header><img class="cityu-logo" src="cityu-logo.png" alt="City University of Hong Kong"><div><h1>CourseMind</h1><p>CityU 数据科学选课规划与课程社区</p></div></header><main class="course-page"><a class="back-link" id="back" href="index.html#community">← 返回课程详情</a><h2 id="title">发布课程评价</h2><form id="reviewForm" class="detail-card"><label>你的昵称或 ID<input id="author" required value="anonymous"></label><label>修读学期<input id="term" required value="2026-A"></label><label>总体评分<select id="rating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label>工作量<select id="workload"><option value="low">低</option><option value="medium" selected>中</option><option value="high">高</option></select></label><label>难度<select id="difficulty"><option value="low">低</option><option value="medium" selected>中</option><option value="high">高</option></select></label><label>评核压力<select id="pressure"><option value="low">低</option><option value="medium" selected>中</option><option value="high">高</option></select></label><label>文字评价<textarea id="content" minlength="30" required placeholder="分享课程内容、学习体验或选课建议（至少30字）"></textarea></label><button type="submit">提交评价</button><p id="result" class="muted"></p></form></main><footer>CourseMind · CityU 数据科学选课与课程社区</footer><script src="review.js?v=1"></script></body></html>
