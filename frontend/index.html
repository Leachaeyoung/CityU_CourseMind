<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CourseMind</title><link rel="stylesheet" href="styles.css?v=5"></head>
<body>
<header><img class="cityu-logo" src="cityu-logo.png" alt="City University of Hong Kong"><div><h1>CourseMind</h1><p>CityU 数据科学选课规划与课程社区</p></div></header>
<nav><button data-tab="consult">选课咨询</button><button data-tab="community">课程社区</button><button data-tab="profile">我的</button></nav>
<main>
<section id="profile" class="tab"><h2>我的</h2><p class="muted">保存你的分流和已修课程，系统会自动计算毕业进度。</p><div class="grid"><label>用户 ID<input id="userId" value="demo-user"></label><label>分流<select id="track"><option>DSC</option><option>DSE</option><option>DSE1</option></select></label><label>Catalogue Year<input id="year" value="2026/27"></label><label>兴趣（逗号分隔）<input id="interests" placeholder="machine learning, NLP"></label></div><label>已修课程（逗号分隔）<input id="completed" placeholder="DSC1001, DSC2001"></label><button id="saveProfile">保存画像</button><div id="profileResult" class="profile-status"></div><div id="profileProgress" class="profile-progress"><p class="muted">保存画像后显示你的课程进度。</p></div></section>
<section id="consult" class="tab active"><h2>选课咨询</h2><p class="muted">请输入任何选课问题，例如课程内容、先修课、课程比较、时间冲突或下学期规划。</p><label>问题<textarea id="question" placeholder="请输入你的选课问题"></textarea></label><input id="consultTerm" type="hidden" value="2026-A"><button id="ask">开始咨询</button><div id="consultResult" class="result" style="white-space:normal;background:#f7f0ec;border-left:4px solid #f36c21;border-radius:8px;padding:16px;margin-top:18px;min-height:70px"></div></section>
<section id="community" class="tab"><h2>课程社区</h2><p class="muted">选择课程，查看课程信息、课表摘要和同学评价。</p><div class="course-filters"><label>搜索课程<input id="courseSearch" placeholder="输入课程代码或名称"></label><label>类别<select id="courseSubject"><option value="">全部类别</option><option value="DSC">DSC 数据科学</option><option value="CS">CS 计算机</option><option value="MA">MA 数学</option><option value="GE">GE 通识</option><option value="OTHER">其他支撑课程</option></select></label><label>学分<select id="courseCredits"><option value="">全部学分</option><option value="1">1 学分</option><option value="2">2 学分</option><option value="3">3 学分</option><option value="4">4 学分</option><option value="6">6 学分</option></select></label><button id="clearCourseFilters" type="button">清除筛选</button></div><p id="courseCount" class="muted"></p><div id="courseCards" class="cards">正在加载课程…</div><div id="courseDetail" class="course-detail" hidden></div><p class="muted">评价可在课程详情页发布。</p></section>
</main><footer>CourseMind · CityU 数据科学选课与课程社区</footer><script src="app.js?v=8"></script>
</body></html>
